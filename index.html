<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invertú | Prototipo funcional</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f7fc;color:#202039;font:16px system-ui,Arial}header{background:#fff;border-bottom:1px solid #e5e0eb;padding:18px 5%}header b{font-size:28px;color:#5934a6}.layout{max-width:1120px;margin:25px auto;display:grid;grid-template-columns:215px 1fr;gap:22px;padding:0 18px}nav,main{background:#fff;border:1px solid #e4dfec;border-radius:22px;padding:24px}nav{height:max-content}nav button{display:block;width:100%;text-align:left;background:#f2ecff;color:#45277f;margin:7px 0}button{font:600 14px system-ui;cursor:pointer;border:0;border-radius:12px;padding:13px 18px;background:#5934a6;color:white;margin:4px 6px 4px 0}button.secondary{background:#eee7fc;color:#45277f}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #9e72ef;outline-offset:3px}h1{font-size:clamp(26px,4vw,36px);line-height:1.2;margin:8px 0 14px}h2{font-size:19px;margin:6px 0}p{line-height:1.55;color:#595569}.hero{background:linear-gradient(120deg,#e9ddff,#fff1d9);padding:30px;border-radius:20px;margin:24px 0}.box{border:1px solid #e4dfec;border-radius:16px;padding:18px;margin:12px 0}.soft{background:#f0eaff;padding:18px;border-radius:16px;margin:16px 0}.warning{background:#fff2d7;padding:14px;border-radius:12px;margin:12px 0}.eyebrow{color:#5934a6;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px}.choice{display:block;width:100%;text-align:left;background:white;color:#26213b;border:2px solid #d9d3e2;margin:10px 0}.choice.active{border-color:#5934a6;background:#f2ecff}input,select{width:100%;padding:14px;border:1px solid #aaa;border-radius:11px;margin:9px 0 20px}label{font-weight:650}.footer{border-top:1px solid #e4dfec;padding-top:15px;margin-top:40px;display:flex;justify-content:space-between;align-items:center;gap:10px}.footer button{background:none;color:#5934a6;text-decoration:underline}.muted{font-size:12px;color:#706b7d}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #e3e0e7;min-width:115px}.scroll{overflow-x:auto}details{border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0}summary{cursor:pointer;font-weight:650;color:#5934a6}@media(max-width:700px){.layout{display:block}nav{margin-bottom:16px}nav button{display:inline-block;width:auto}main{padding:20px}}</style></head><body><header><b>invertú<span style="color:#f0ae35">.</span></b><span class="muted" style="margin-left:20px">Prototipo conceptual · Datos ficticios</span></header><div class="layout"><nav id="nav" aria-label="Navegación principal"></nav><main id="app" tabindex="-1"></main></div><script>
const products=[{id:'f',name:'Fondo Horizonte',kind:'Fondo de inversión',desc:'Una alternativa que reúne el dinero de varias personas para invertirlo siguiendo una estrategia.',min:100000,risk:'Medio',cost:'Comisión de administración simulada del 1 % anual.',time:'Puedes solicitar el retiro y recibir el dinero en aproximadamente tres días hábiles, sujeto a las condiciones del fondo.',period:'Sin plazo fijo'},{id:'d',name:'Depósito Plazo Fijo',kind:'Depósito a término',desc:'Una alternativa en la que depositas dinero durante un plazo acordado.',min:500000,risk:'Bajo, no nulo',cost:'Sin costo de apertura en este ejemplo ficticio.',time:'Al finalizar el plazo de 12 meses.',period:'12 meses'},{id:'a',name:'Acciones Abiertas',kind:'Acciones',desc:'Una alternativa para participar en empresas mediante acciones cuyo valor puede cambiar.',min:200000,risk:'Alto',cost:'Comisión simulada de $5.000 por operación.',time:'Depende de las condiciones del mercado y de la posibilidad de vender.',period:'Sin plazo fijo'}];
let page='home',history=[],form={},saved=[],compared=[],active='f',query='',loadError=false,notice='';const $=id=>document.getElementById(id),money=n=>'$'+n.toLocaleString('es-CO');
function scrollToBeginning(){let n=$('app');while(n){n.scrollTop=0;n=n.parentElement}window.scrollTo(0,0);requestAnimationFrame(()=>{window.scrollTo(0,0);$('app').querySelector('h1')?.focus({preventScroll:true})})}
function go(id){history.push(page);page=id;notice='';render();scrollToBeginning()}function back(){page=history.pop()||'home';render();scrollToBeginning()}function reset(){page='home';history=[];form={};saved=[];compared=[];query='';loadError=false;notice='';render();scrollToBeginning()}
function updateSearch(input){const start=input.selectionStart,end=input.selectionEnd;query=input.value;render();const fresh=document.getElementById("q");if(fresh){fresh.focus({preventScroll:true});fresh.setSelectionRange(start,end)}}
function set(k,v){form[k]=v;render()}function toggle(k,id){let a=k==='saved'?saved:compared;let i=a.indexOf(id);if(i>=0)a.splice(i,1);else if(k==='saved'||a.length<3)a.push(id);else notice='Puedes comparar hasta tres alternativas al mismo tiempo.';render()}
function btn(t,action,secondary=false,disabled=false){return `<button ${disabled?'disabled':''} class="${secondary?'secondary':''}" onclick="${action}">${t}</button>`}function head(tag,title,desc){return `<p class="eyebrow">${tag}</p><h1 tabindex="-1">${title}</h1><p>${desc}</p>`}function choice(k,items){return items.map(([v,t])=>`<button aria-pressed="${form[k]===v}" class="choice ${form[k]===v?'active':''}" onclick="set('${k}','${v}')">${form[k]===v?'✓ ':''}${t}</button>`).join('')}function field(k,label,items){return `<label for="${k}">${label}</label><select id="${k}" onchange="set('${k}',this.value)"><option value="">Selecciona una opción</option>${items.map(([v,t])=>`<option value="${v}" ${form[k]===v?'selected':''}>${t}</option>`).join('')}</select>`}function box(title,desc){return `<section class="box"><h2>${title}</h2><p>${desc}</p></section>`}function help(title,desc){return `<details><summary>${title}</summary><p>${desc}</p></details>`}
function render(){let h=history.length&&page!=='home'?btn('← Volver','back()',true):'';$('nav').innerHTML='<b>Tu espacio</b>'+[['home','Inicio'],['explore','Explorar'],['learn','Aprender'],['compare','Comparar'],['saved','Guardados']].map(([id,t])=>btn(t,`go('${id}')`,true)).join('')+'<p class="warning muted">Los productos, montos, costos y plazos son ficticios y solo demuestran la experiencia.</p>';
if(page==='home')h+=head('Bienvenido a Invertú','Invertir comienza por entender.','Descubre, comprende y compara alternativas de inversión a tu ritmo.')+'<div class="hero"><h2>No necesitas saberlo todo para comenzar.</h2><p>Te acompañamos en cada paso.</p></div>'+btn('Descubrir paso a paso',"go('level')")+btn('Explorar por mi cuenta',"go('explore')",true)+'<p class="muted">Explorar no implica contratar una inversión.</p>';
if(page==='level')h+=head('Paso 1 de 3','¿Qué tanto conoces sobre inversiones?','Queremos conocer tu experiencia para acompañarte mejor durante el recorrido.')+choice('level',[['new','Estoy empezando.'],['some','Conozco algunas opciones.'],['experienced','Ya he invertido.']])+btn('Continuar',"go('goal')",false,!form.level);
if(page==='goal')h+=head('Paso 2 de 3','¿Qué te motiva a explorar inversiones?','No necesitas tener un objetivo definido. Exploremos lo que es importante para ti.')+choice('goal',[['project','Ahorrar para un proyecto personal.'],['growth','Explorar oportunidades para mis ahorros.'],['explore','Conocer las alternativas disponibles.']])+btn('Continuar',"go('budget')",false,!form.goal);
if(page==='budget')h+=head('Paso 3 de 3','Hablemos de tus posibilidades.','Cada persona tiene posibilidades diferentes. Cuéntanos un poco sobre las tuyas para acompañarte mejor.')+field('budget','¿Cuánto dinero considerarías invertir?',[['low','Menos de $500.000'],['mid','Entre $500.000 y $2.000.000'],['high','Más de $2.000.000'],['unsure','Todavía no lo sé']])+field('horizon','¿En cuánto tiempo podrías necesitar tu dinero?',[['short','En menos de un año.'],['medium','Entre uno y tres años.'],['long','Después de tres años.'],['unsure','Todavía no lo sé.']])+'<div class="soft">Responder estas preguntas no implica realizar una inversión.</div>'+btn('Ver mi guía de exploración',"go('orientation')",false,!form.budget||!form.horizon);
if(page==='orientation'){let e=form.level==='new'?['Comienza por comprender.','Antes de elegir, conoce cómo funcionan las inversiones, qué riesgos tienen y cuáles son sus condiciones.']:form.level==='some'?['Profundiza en tus opciones.','Explora las características de cada alternativa y compara sus riesgos, costos y condiciones.']:['Explora con mayor detalle.','Consulta las características de las alternativas y compara la información que necesitas para decidir.'];let g=form.goal==='project'?['Ten presente tu objetivo.','Considera cuándo necesitarás el dinero para tu proyecto y revisa las condiciones de cada alternativa.']:form.goal==='growth'?['Conoce las posibilidades y sus riesgos.','Compara las características de las inversiones y recuerda que los resultados pueden variar.']:['Explora sin compromisos.','Descubre cómo funcionan las diferentes opciones y tómate el tiempo que necesites para conocerlas.'];let t=form.horizon==='short'?['Ten en cuenta cuándo necesitarás tu dinero.','Revisa los plazos y las condiciones para retirarlo antes de explorar una alternativa.']:form.horizon==='long'?['Conoce los riesgos a largo plazo.','Revisa cómo podrían cambiar los resultados de una inversión durante el tiempo que planeas mantenerla.']:['Compara los plazos.','Conoce cuándo podrías disponer de tu dinero y qué condiciones debes considerar.'];h+=head('Tu guía de exploración','Tu camino para explorar comienza aquí.','Cada decisión comienza por conocerte. Estos son algunos aspectos que puedes tener en cuenta al explorar tus alternativas.')+box('Tu experiencia · '+e[0],e[1])+box('Tu objetivo · '+g[0],g[1])+box('Tu dinero y disponibilidad · '+t[0],t[1])+'<p class="warning">Esta guía te ayuda a explorar, pero no determina qué inversión es adecuada para ti.</p>'+btn('Descubrir mis alternativas',"go('explore')")+btn('Editar mis respuestas',"go('level')",true)}
if(page==='explore'){let lim=form.budget==='low'?499999:form.budget==='mid'?2000000:Infinity;let matches=products.filter(p=>(p.name+' '+p.kind+' '+p.desc).toLowerCase().includes(query.toLowerCase())).sort((a,b)=>Number(b.min<=lim)-Number(a.min<=lim));h+=head('Explorar','Explora alternativas a tu ritmo.','Cada alternativa tiene características diferentes. Conoce cómo funciona, sus riesgos y condiciones para explorar con mayor claridad.')+'<label for="q">Buscar alternativas</label><input id="q" placeholder="Escribe el nombre o tipo de inversión." value="'+query.replaceAll('&','&amp;').replaceAll('"','&quot;')+'" oninput="updateSearch(this)">';if(form.level)h+='<div class="soft">Tu guía sigue contigo. '+btn('Ver mi guía',"go('orientation')",true)+'</div>';if(loadError)h+='<div role="alert" class="warning"><h2>No pudimos mostrar las alternativas.</h2><p>Intenta nuevamente. Tus respuestas siguen guardadas.</p>'+btn('Reintentar','loadError=false;render()')+'</div>';else h+=matches.length?matches.map(p=>`<article class="box"><p class="eyebrow">${p.kind} · Producto ficticio</p><h2>${p.name}</h2><p>${p.desc}</p><p>Monto mínimo: <b>${money(p.min)}</b> · Riesgo: <b>${p.risk}</b></p>${p.min>lim?'<p class="warning">Esta alternativa requiere un monto mayor. Puedes conocer sus características o explorar otras opciones.</p>':''}${btn('Conocer esta alternativa',`active='${p.id}';go('detail')`)}${btn(saved.includes(p.id)?'Quitar de guardados':'Guardar para después',`toggle('saved','${p.id}')`,true)}</article>`).join(''):'<div class="warning" role="status"><h2>No encontramos alternativas con esa búsqueda.</h2><p>Prueba con otra palabra o explora todas las opciones disponibles.</p>'+btn('Ver todas las alternativas',"query='';render()",true)+'</div>';h+='<p>'+btn('Simular error de carga (demostración)','loadError=!loadError;render()',true)+'</p>'}
if(page==='detail'){let p=products.find(x=>x.id===active);h+=head('Detalle de inversión','Descubre cómo funciona esta inversión.','Cada inversión tiene características diferentes. Te ayudamos a comprender cómo funciona esta alternativa y qué debes considerar antes de elegir.')+`<p class="eyebrow">${p.kind} · Producto ficticio</p><h2>${p.name}</h2>`+box('¿Cómo funciona?',p.desc)+box('¿Con cuánto puedes comenzar?','Desde '+money(p.min)+'.')+box('¿Qué riesgos debes conocer?','El valor de tu inversión puede variar con el tiempo, dependiendo de las condiciones del mercado. Los resultados no están garantizados.')+box('¿Qué costos tiene?',p.cost)+box('¿Cuándo puedes disponer de tu dinero?',p.time)+help('¿Por qué puede cambiar el valor de mi inversión?','Las condiciones del mercado pueden hacer que el valor de una inversión aumente o disminuya. Esto también puede afectar el dinero que recuperes.')+help('¿Qué significa tener disponibilidad del dinero?','Es la posibilidad de retirar o recuperar tu dinero, según los plazos y condiciones de cada inversión.')+btn('Comparar esta alternativa',`if(!compared.includes('${p.id}')&&compared.length<3)compared.push('${p.id}');go('compare')`)+btn('Guardar para después',`toggle('saved','${p.id}')`,true)+btn('Ver otras alternativas',"go('explore')",true)}
if(page==='compare'){h+=head('Comparar','Descubre qué hace diferente a cada alternativa.','Cada alternativa tiene características diferentes. Compáralas y descubre qué debes considerar antes de tomar una decisión.')+'<h2>Tus alternativas seleccionadas</h2>'+products.map(p=>btn((compared.includes(p.id)?'✓ ':'+ ')+p.name,`toggle('compare','${p.id}')`,true)).join('');if(compared.length<2)h+='<div class="soft">Agrega otra alternativa para comparar. Selecciona al menos dos opciones para conocer sus diferencias.</div>';else h+='<div class="scroll"><table><thead><tr><th>Característica</th>'+compared.map(id=>'<th>'+products.find(p=>p.id===id).name+'</th>').join('')+'</tr></thead><tbody>'+[['Monto mínimo','min'],['Nivel de riesgo','risk'],['Disponibilidad del dinero','time'],['Costos','cost'],['Plazo','period']].map(([label,key])=>'<tr><th>'+label+'</th>'+compared.map(id=>{let v=products.find(p=>p.id===id)[key];return '<td>'+(key==='min'?money(v):v)+'</td>'}).join('')+'</tr>').join('')+'</tbody></table></div>';h+=help('¿Qué significa el nivel de riesgo?','Es una forma de expresar qué tanto pueden variar los resultados de una inversión.')+help('¿Por qué algunas inversiones tienen costos?','Algunas alternativas incluyen comisiones o cargos por su administración u operación.')+'<p class="muted">La información es ilustrativa. Ninguna alternativa es la mejor para todas las personas.</p>'+btn('Descubrir mi siguiente paso',"go('next')",false,compared.length<2)+btn('Explorar otras alternativas',"go('explore')",true)}
if(page==='next')h+=head('Tu siguiente paso','Tu camino continúa cuando tú lo decidas.','Conocer tus alternativas es el primer paso para tomar decisiones informadas. Sigue explorando, aprende más o continúa cuando te sientas preparado.')+'<div class="soft">Las mejores decisiones comienzan con información y confianza. Sigue descubriendo a tu ritmo.</div><h2>¿Qué te gustaría hacer ahora?</h2>'+btn('Conocer los pasos para invertir',"go('learn')")+btn('Ver mis guardados',"go('saved')",true)+btn('Explorar más alternativas',"go('explore')",true);
if(page==='saved')h+=head('Tus opciones','Guardados','Consulta las alternativas que te interesaron.')+(saved.length?saved.map(id=>{let p=products.find(x=>x.id===id);return box(p.name,p.desc)+btn('Ver detalles',`active='${id}';go('detail')`)}).join(''):'<div class="soft">Todavía no tienes alternativas guardadas. Puedes explorar las opciones disponibles y guardar las que quieras consultar después.</div>')+btn('Explorar alternativas',"go('explore')",true);
if(page==='learn')h+=head('Aprender','Conoce los pasos antes de comenzar.','Revisa los requisitos y las condiciones que debes considerar antes de realizar una inversión.')+help('¿Qué es el riesgo?','El valor de una inversión puede variar. Los resultados no están garantizados.')+help('¿Qué debo revisar antes de invertir?','Monto mínimo, riesgos, costos, plazos y condiciones de retiro.')+help('¿Cómo puedo invertir?','Primero debes revisar las condiciones y cumplir los requisitos aplicables. Esta demostración no permite contratar productos.')+btn('Explorar más alternativas',"go('explore')");
h+='<div class="footer"><span class="muted">Invertú · UX Writing aprobado · Datos ficticios</span>'+btn('Reiniciar experiencia','reset()',true)+'</div>';$('app').innerHTML=h;}render();
</script></body></html>
